title: EODigitalTwins
copyright: "2026"
author: CEOS WGISS TEIG
logo: CEOS_logo_colour_black_text_right.png

execute:
  execute_notebooks: auto
  timeout: 120

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution
    - tasklist

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    html_css_files:
      - custom.css

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/maralbayaraa/EODigitalTwins
  path_to_book: WhitePaper
  branch: main

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_navbar: true
  extra_footer: "EODigitalTwins"
